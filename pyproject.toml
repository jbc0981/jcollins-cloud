[project]
name = "jcollins-cloud"
version = "0.1.0"
description = "Personal website: a small containerized Flask app hosted on AWS App Runner"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1",
    "gunicorn>=26",
]

[tool.uv]
# This is a deployed app, not a library -- don't try to build/install it as
# an importable package into its own virtualenv.
package = false
